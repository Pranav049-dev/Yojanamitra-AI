version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: yojanamitra_db
    restart: always
    environment:
      POSTGRES_USER: yojanamitra
      POSTGRES_PASSWORD: yojanamitra_secure_password_2026
      POSTGRES_DB: yojanamitra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yojanamitra -d yojanamitra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yojanamitra_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://yojanamitra:yojanamitra_secure_password_2026@db:5432/yojanamitra_db
      SECRET_KEY: yojanamitra-production-super-secret-jwt-key-2026
      AI_PROVIDER: local_rag
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yojanamitra_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
